name: "Require CI success"
description: "Fails unless the latest run of a workflow for a commit concluded successfully."

inputs:
  sha:
    description: "Full commit SHA that must have passed CI."
    required: true
  token:
    description: "Token with actions: read permission."
    required: true
  workflow:
    description: "Workflow file name to check."
    required: false
    default: "ci.yml"

runs:
  using: "composite"
  steps:
    - name: Check CI conclusion
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        set -euo pipefail
        conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --commit "$SHA" \
          --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
        if [[ "$conclusion" != "success" ]]; then
          echo "::error::$WORKFLOW for commit $SHA is '${conclusion:-missing}', not 'success'."
          exit 1
        fi
        echo "$WORKFLOW passed for commit $SHA."
