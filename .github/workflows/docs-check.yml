name: Docs Check

# Keeps README.md, docs/, scripts/ and templates/ consistent. Fix a stale README set table with:
#   scripts/check-docs.sh --fix
on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - scripts/**
      - templates/**
      - bootstrap.sh
      - .github/workflows/docs-check.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check docs are consistent
        run: scripts/check-docs.sh
