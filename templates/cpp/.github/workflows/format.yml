name: Format Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fails when any C/C++ file differs from .clang-format and lists the files in the job summary.
      # Use the same major version locally (pip install "clang-format==22.*") so results match.
      - name: Check formatting
        uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: "22"
