codecov:
  require_ci_to_pass: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

coverage:
  status:
    project:
      default:
        target: auto # The previous commit's coverage
        threshold: 5% # Allow a 5% drop without failing
        base: auto
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

ignore:
  - "dist/**"
  - "test/**"
  - "**/*.test.*"
  - "**/*.spec.*"
