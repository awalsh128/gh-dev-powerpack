name: "Setup environment"
description: "Sets up Node.js and installs dependencies with npm ci"

inputs:
  ignore-scripts:
    description: >-
      Skip install scripts, both dependencies' and this package's prepare script. For privileged
      jobs, such as releases, so dependency code can't run with their credentials at install.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: "npm"
        registry-url: "https://registry.npmjs.org"

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          npm ci --ignore-scripts
        else
          npm ci
        fi
