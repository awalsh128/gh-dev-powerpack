name: Pull Request

# Checks that don't depend on the project's language:
# - Pull requests target staging. main only moves when promote.yml fast-forwards it to staging, so a merge
#   into main would add a commit that staging doesn't have.
# - Dependency review fails a pull request that adds a vulnerable dependency (needs the dependency graph
#   turned on).
# The Conventional Commit title check is the Commit Lint workflow (conventional-commits set).
#
# rulesets/staging.json requires checks named like the jobs below. Rename them together.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the base branch can change

permissions:
  contents: read

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require staging as the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "staging" ]; then
            echo "::error::Pull requests target staging, not $BASE_REF; main is updated by promotion."
            exit 1
          fi

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
