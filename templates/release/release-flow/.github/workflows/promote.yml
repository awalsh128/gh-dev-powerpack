# Promotes staging to main by fast-forwarding main to staging's latest commit, then starts the
# official release. main never gets commits of its own (no merge, squash or release commits), so it
# is always an ancestor of staging.
#
# Requires:
# - The Octo STS GitHub App installed on the repository and allowed to bypass main's ruleset, and the
#   .github/chainguard/promote.sts.yaml trust policy on the default branch. No app key or
#   token is stored. See docs/github-release-setup.md and scripts/apply_rulesets.sh in gh-dev-powerpack.
# - .github/actions/require-ci-success (from the common template set).
# - A ci.yml that runs on pushes to staging, and a publish.yml that can be dispatched on main.
name: Promote staging to main

on:
  workflow_dispatch:
    inputs:
      confirm-major:
        description: "Required for a major release: the version being released (e.g. 2.0.0)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # Read CI runs and start the release workflow
      id-token: write # For OIDC: Octo STS exchanges it for the release-bot token
    steps:
      # main's ruleset only lets the Octo STS app update it, so main is pushed with a short-lived
      # token it issues for this run, as the trust policy allows (contents: write).
      - name: Get release-bot token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: promote

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Resolve staging commit
        shell: bash
        run: echo "STAGING_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require CI success on staging
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ env.STAGING_SHA }}
          token: ${{ github.token }}

      # A major release strands users of the previous major (there is no maintenance branch), so it needs
      # its version typed in. The first official release counts as a major. Assumes `v${version}` tags.
      - name: Confirm a major release
        env:
          CONFIRM: ${{ inputs.confirm-major }}
        shell: bash
        run: |
          set -euo pipefail
          official="$(git tag --merged origin/main --list 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n1 || true)"
          candidate="$(git tag --merged "$STAGING_SHA" --list 'v[0-9]*-rc.*' | sort -V | tail -n1 || true)"
          if [[ -z "$candidate" ]]; then
            echo "Nothing new to release: staging has no candidate. main still fast-forwards."
            exit 0
          fi
          next="${candidate#v}"
          next="${next%%-*}"
          if [[ -n "$official" && "$(printf '%s\n%s\n' "${official#v}" "$next" | sort -V | tail -n1)" == "${official#v}" ]]; then
            echo "Nothing new to release: $official is already out. main still fast-forwards."
            exit 0
          fi
          echo "Promotion releases $next."
          if [[ -z "$official" || "${next%%.*}" -gt "$(cut -d. -f1 <<<"${official#v}")" ]]; then
            [[ "$CONFIRM" == "$next" ]] || {
              echo "::error::$next is a major release. Run Promote again with confirm-major set to $next."
              exit 1
            }
          fi

      - name: Fast-forward main to staging
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor origin/main "$STAGING_SHA"; then
            echo "::error::main has commits that are not on staging, so it can't be fast-forwarded."
            echo "Get those commits onto staging through a pull request, then promote again."
            exit 1
          fi
          # Not a force push, so the remote rejects anything but a fast-forward.
          git push origin "$STAGING_SHA:refs/heads/main"

      - name: Start official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run publish.yml --ref main
