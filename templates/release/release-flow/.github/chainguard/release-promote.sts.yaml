# Octo STS trust policy: lets promote.yml, run on staging, get a short-lived token that can push to
# main. The Octo STS app must be a bypass actor on main's ruleset (scripts/apply_rulesets.sh -a).
issuer: https://token.actions.githubusercontent.com
subject_pattern: "repo:__OWNER__@__OWNER_ID__/__REPO__@__REPO_ID__:.*"
claim_pattern:
  ref: "refs/heads/staging"
  job_workflow_ref: "__OWNER__/__REPO__/\\.github/workflows/promote\\.yml@refs/heads/staging"
permissions:
  contents: write
