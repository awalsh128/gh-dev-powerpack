# Octo STS trust policy: lets the release job, running in the 'release' environment, get a
# short-lived token that can push release tags. The 'release' environment only allows main and
# staging.
issuer: https://token.actions.githubusercontent.com
subject: repo:__OWNER__/__REPO__:environment:release
claim_pattern:
  job_workflow_ref: __OWNER__/__REPO__/.github/workflows/release.yml@refs/heads/(main|staging)
permissions:
  contents: write
