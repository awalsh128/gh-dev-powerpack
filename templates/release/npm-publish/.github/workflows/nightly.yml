name: Nightly release candidate

# Starts a nightly release candidate when staging has shippable changes since its last release. Schedules
# only run on the default branch, so this runs on main and starts publish.yml on staging. It starts
# publish.yml on its own instead of calling it: npm trusted publishing trusts that workflow file only when it
# is started directly. publish.yml still releases nothing when no commit calls for a version.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Shippable files are what the package publishes: sources and manifests, not docs, tests or workflows.
  # Adjust to the project's layout; for a monorepo, check each package with its own tag pattern.
  SHIPPABLE_PATHS: "src package.json package-lock.json tsconfig.json"
  TAG_PATTERN: "v*"

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # Start the publish workflow
    steps:
      - name: Checkout staging
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false

      - name: Look for shippable changes since the last release
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match "$TAG_PATTERN" HEAD 2>/dev/null || true)"
          if [[ -z "$last" ]]; then
            echo "No release yet, so everything is new."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086 # SHIPPABLE_PATHS is a list of paths
          files="$(git diff --name-only "$last" HEAD -- $SHIPPABLE_PATHS)"
          if [[ -z "$files" ]]; then
            echo "No shippable changes since $last."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Shippable changes since $last:"
            echo "$files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start release candidate
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run publish.yml --ref staging
