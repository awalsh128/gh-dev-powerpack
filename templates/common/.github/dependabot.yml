# Keeps pinned action SHAs current, with Conventional Commits messages so they pass commitlint.
# Uncomment and adjust the second block for the project's package ecosystem
# (npm, pip, gomod, cargo, nuget, maven, gradle, docker, ...).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

