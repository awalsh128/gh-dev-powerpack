name: Sync Labels

# Creates and updates labels from .github/labels.yaml. Never deletes labels (skip-delete).
# On pull requests that change the file it only does a dry run, so the log shows what would change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yaml"
      - ".github/workflows/sync-labels.yml"
  pull_request:
    paths:
      - ".github/labels.yaml"
      - ".github/workflows/sync-labels.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yaml
          skip-delete: true
          dry-run: ${{ github.event_name == 'pull_request' }}
