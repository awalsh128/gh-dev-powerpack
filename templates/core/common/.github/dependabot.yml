# Keeps pinned action SHAs current, with Conventional Commits messages so they pass commitlint.
# Uncomment and adjust the second block for the project's package ecosystem
# (npm, pip, gomod, cargo, nuget, maven, gradle, docker, ...).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    # With the release-flow set, add `target-branch: staging`: pull requests target staging, not main.
    schedule:
      interval: weekly
    # Skip releases younger than a week, giving a compromised release time to be caught.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

