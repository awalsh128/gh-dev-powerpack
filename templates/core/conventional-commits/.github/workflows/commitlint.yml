name: Commit Lint

# The commit-msg hook can be skipped locally, so check the PR title too. Squash merges use the PR title as
# the commit message, so it is the one that counts; per-commit linting would prove nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

# A new push to a PR supersedes its running checks; other runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
