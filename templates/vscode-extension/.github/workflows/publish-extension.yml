name: Publish Extension

# Releases the VS Code extension: semantic-release picks the next version from Conventional Commits
# since the last v* tag, tags it, and creates the GitHub release with the VSIX; the job then
# publishes the VSIX to the Visual Studio Marketplace and Open VSX with trusted publishing (the
# job's OIDC token), so the workflow stores no publishing secrets. Releases never commit, so main
# keeps fast-forwarding to staging. Runs that find no release-worthy commits publish nothing.
#
# Start it by hand on main. Versions follow VS Code's pre-release convention: releases use even
# minor versions (1.0.x, 1.2.x) and pre-releases odd ones (1.1.x, 1.3.x).
#
# Requires (see docs/vscode-extension-publishing.md in gh-dev-powerpack):
# - A 'release' environment that only main and staging can use, holding RELEASE_BOT_APP_ID
#   (variable) and RELEASE_BOT_PK (secret) for the app that pushes release tags.
# - Marketplace and Open VSX trusted publishers for this workflow file and the 'release' environment.
# - .github/actions/setup (node set) and .github/actions/require-ci-success (common set).
# - release.config.cjs in EXTENSION_DIR and scripts/vscode-release/ (vscode-extension set).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the next version and release notes without publishing
        required: true
        type: boolean
        default: true
      pre_release:
        description: Publish a pre-release on the next odd minor version (1.1.x, 1.3.x)
        required: true
        type: boolean
        default: false

permissions: {}

env:
  # The extension's directory, which holds its package.json and release.config.cjs.
  EXTENSION_DIR: "."

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: publish-extension
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results
      contents: write # For tags and GitHub releases
      id-token: write # For OIDC: Marketplace and Open VSX trusted publishing
      issues: write # For semantic-release comments
      pull-requests: write # For semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # semantic-release reads every commit and tag since the last release
          persist-credentials: false

      - name: Require CI success
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # This job can mint registry and GitHub tokens, so dependencies' install scripts don't run.
      # vsce runs the extension's vscode:prepublish script when it packages.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      # GitHub rejects tag creation by GITHUB_TOKEN when a ruleset restricts creations, so the tag
      # is pushed with the release-bot app token.
      - name: Create release-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PK }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # The release tools are pinned here rather than in package.json, so their dependencies don't
      # reach the project's audit.
      - name: Release
        working-directory: ${{ env.EXTENSION_DIR }}
        env:
          # semantic-release pushes the tag with GIT_CREDENTIALS and calls the GitHub API with
          # GITHUB_TOKEN.
          GIT_CREDENTIALS: x-access-token:${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VSCE_PRE_RELEASE: ${{ inputs.pre_release }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npx --yes \
            --package semantic-release@25.0.9 \
            --package semantic-release-vsce@6.1.8 \
            --package conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release $DRY_RUN_FLAG

      # The newest v* tag on HEAD is this run's release or, when a run is retried after a partial
      # failure, the release it made.
      - name: Find the release tag
        id: tag
        if: ${{ !inputs.dry_run }}
        run:
          echo "tag=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)" >>
          "$GITHUB_OUTPUT"

      # Publishes the tagged version, so a retried run (which releases nothing new) still publishes.
      # --skip-duplicate skips a registry that already has it, and one registry failing does not
      # stop the other.
      - name: Publish to the Marketplace and Open VSX
        if: ${{ !inputs.dry_run && steps.tag.outputs.tag != '' }}
        working-directory: ${{ env.EXTENSION_DIR }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          set -uo pipefail
          npm pkg set version="${TAG#v}"
          pre=()
          [[ "$PRE_RELEASE" == "true" ]] && pre=(--pre-release)
          npx --yes @vscode/vsce@4.1.0 package "${pre[@]}" --out extension.vsix || exit 1
          failed=0
          npx --yes @vscode/vsce@4.1.0 publish --packagePath extension.vsix --oidc --skip-duplicate \
            || failed=1
          npx --yes ovsx@1.3.0 publish extension.vsix --trusted-publishing --skip-duplicate \
            || failed=1
          exit "$failed"

      # semantic-release only marks releases from prerelease branches, which would add a -suffix
      # that the registries reject, so the GitHub release is marked here instead.
      - name: Mark the GitHub release as a pre-release
        if: ${{ inputs.pre_release && !inputs.dry_run && steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release edit "$TAG" --prerelease
